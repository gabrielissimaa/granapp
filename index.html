<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grana</title>
<meta name="theme-color" content="#0F0A1E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0F0A1E; --bg1:#170F2C;
    --surface:rgba(255,255,255,0.045); --surface-hi:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.09); --border-hi:rgba(255,255,255,0.16);
    --text:#F5F3FB; --text-muted:#9C97B8;
    --mint:#00E6A0; --coral:#FF5C7A; --cyan:#4DD9FF; --amber:#FFB84D; --violet:#8B6CFF; --pink:#FF5CC8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:
      radial-gradient(1100px 700px at 100% -10%, rgba(139,108,255,0.25), transparent 60%),
      radial-gradient(900px 600px at -10% 100%, rgba(0,230,160,0.12), transparent 55%),
      var(--bg0);
    color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh;}
  .num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;margin:0;}
  ::selection{background:var(--violet);color:#fff;}

  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:236px;flex-shrink:0;padding:22px 14px;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow-y:auto;max-height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px 8px;margin-bottom:12px;border-bottom:1px solid var(--border);}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--violet),var(--pink));flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fff;font-size:15px;box-shadow:0 4px 18px rgba(139,108,255,0.45);}
  .brand-text{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#fff;}
  .brand-text small{display:block;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:400;color:var(--text-muted);margin-top:1px;}
  .navgroup{margin-bottom:10px;}
  .navgroup-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);opacity:.6;padding:10px 12px 4px 12px;font-weight:700;}
  nav{display:flex;flex-direction:column;gap:2px;}
  .navbtn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;background:none;border:none;color:var(--text-muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;text-align:left;cursor:pointer;transition:all .15s;width:100%;}
  .navbtn:hover{color:var(--text);background:var(--surface);}
  .navbtn.active{color:#fff;background:linear-gradient(135deg,rgba(139,108,255,0.35),rgba(255,92,200,0.18));box-shadow:inset 0 0 0 1px var(--border-hi);}
  .navbtn svg{width:15px;height:15px;flex-shrink:0;}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);font-size:12px;}
  .sync-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;color:var(--text-muted);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--mint);flex-shrink:0;box-shadow:0 0 6px var(--mint);}
  .dot.warn{background:var(--amber);box-shadow:0 0 6px var(--amber);}
  .dot.bad{background:var(--coral);box-shadow:0 0 6px var(--coral);}
  .sidebar-foot button{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);border-radius:8px;padding:8px 10px;font-size:11.5px;cursor:pointer;width:100%;font-family:'Inter',sans-serif;margin-top:0;}
  .sidebar-foot button:hover{border-color:var(--border-hi);color:var(--text);}

  /* Main */
  main{flex:1;padding:30px 38px;max-width:1120px;}
  .page{display:none;}
  .page.active{display:block;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-head h1{font-size:25px;color:#fff;}
  .page-head p{color:var(--text-muted);margin-top:4px;font-size:13px;}
  .btn{background:var(--surface-hi);color:var(--text);border:1px solid var(--border-hi);padding:9px 15px;border-radius:9px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
  .btn:hover{border-color:var(--violet);}
  .btn.accent{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;border:none;box-shadow:0 6px 20px rgba(139,108,255,0.35);}
  .btn.accent:hover{filter:brightness(1.08);}
  .btn.ghost{background:none;border:1px solid var(--border);color:var(--text-muted);}
  .btn.ghost:hover{border-color:var(--border-hi);color:var(--text);}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:7px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  select.period{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:9px;font-family:'Inter',sans-serif;font-size:13px;}

  /* Hero */
  .hero{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
  .hero.six{grid-template-columns:repeat(3,1fr);}
  .hero-cell{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:18px 20px;position:relative;overflow:hidden;}
  .hero-cell.total{background:linear-gradient(160deg, rgba(139,108,255,0.22), rgba(255,92,200,0.10));border-color:var(--border-hi);}
  .hero-cell .label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600;}
  .hero-cell .value{font-family:'Space Grotesk',sans-serif;font-size:26px;margin-top:7px;font-weight:700;}
  .hero-cell.total .value{background:linear-gradient(120deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero-cell .sub{font-size:11.5px;color:var(--text-muted);margin-top:5px;}
  .pos{color:var(--mint);} .neg{color:var(--coral);}

  section.block{margin-bottom:26px;}
  .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .block-head h3{font-size:12px;color:var(--text-muted);font-weight:700;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.06em;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:20px;}

  /* Indicator chips */
  .chipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .chip{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .chip .lbl{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .chip .val{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:600;margin-top:5px;}

  /* Chart */
  .chart{display:flex;align-items:flex-end;gap:12px;height:150px;padding:0 6px;overflow-x:auto;}
  .chart-col{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .chart-bars{display:flex;gap:3px;align-items:flex-end;height:118px;width:100%;justify-content:center;}
  .bar{width:11px;border-radius:5px 5px 2px 2px;}
  .bar.in{background:linear-gradient(180deg,#5CFFC4,var(--mint));box-shadow:0 0 10px rgba(0,230,160,0.35);}
  .bar.out{background:linear-gradient(180deg,#FF8FA3,var(--coral));box-shadow:0 0 10px rgba(255,92,122,0.3);}
  .bar.inv{background:linear-gradient(180deg,#B7A2FF,var(--violet));box-shadow:0 0 10px rgba(139,108,255,0.3);}
  .chart-col .lbl{font-size:10px;color:var(--text-muted);margin-top:7px;text-transform:capitalize;}
  .legend{display:flex;gap:16px;font-size:11.5px;color:var(--text-muted);margin-top:14px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

  /* split bars */
  .split{display:flex;height:14px;border-radius:8px;overflow:hidden;margin-top:6px;box-shadow:inset 0 0 0 1px var(--border);}
  .split div{height:100%;}
  .split-legend{display:flex;gap:16px;margin-top:10px;font-size:11.5px;flex-wrap:wrap;}
  .split-legend span{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);}
  .split-legend i{width:9px;height:9px;border-radius:3px;}
  .split-legend b{color:var(--text);font-family:'JetBrains Mono',monospace;}
  .split-row{margin-bottom:16px;}
  .split-row:last-child{margin-bottom:0;}
  .split-row-title{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:4px;}

  /* ledger rows */
  .ledger{display:flex;flex-direction:column;gap:6px;}
  .row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:11px;background:var(--surface);border:1px solid var(--border);font-size:13px;position:relative;padding-left:20px;flex-wrap:wrap;}
  .row::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent,var(--violet));}
  .row:hover{border-color:var(--border-hi);}
  .row .desc{flex:1;min-width:120px;}
  .row .desc .t{font-weight:600;color:var(--text);}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;flex-shrink:0;white-space:nowrap;}
  .badge.outline{background:none;border:1px solid var(--border-hi);color:var(--text-muted);}
  .row .acc{width:96px;color:var(--text-muted);font-size:11.5px;flex-shrink:0;}
  .row .date{width:60px;color:var(--text-muted);font-size:11.5px;flex-shrink:0;}
  .row .amt{width:100px;text-align:right;font-weight:700;flex-shrink:0;}
  .row .actions{display:flex;gap:4px;opacity:0;flex-shrink:0;margin-left:auto;}
  .row:hover .actions{opacity:1;}
  .iconbtn{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:5px;border-radius:6px;}
  .iconbtn:hover{color:var(--coral);background:rgba(255,92,122,0.1);}
  .iconbtn svg{width:14px;height:14px;display:block;}
  .empty{padding:28px 4px;text-align:center;color:var(--text-muted);font-size:13px;}

  /* cards grid */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .card{border:1px solid var(--border);border-radius:16px;padding:17px;position:relative;background:var(--surface);border-top:3px solid var(--accent,var(--violet));overflow:hidden;}
  .card::after{content:'';position:absolute;top:-40px;right:-40px;width:100px;height:100px;border-radius:50%;background:var(--accent,var(--violet));opacity:.15;filter:blur(10px);}
  .card .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600;}
  .card .v{font-family:'Space Grotesk',sans-serif;font-size:21px;margin-top:6px;font-weight:700;position:relative;}
  .card .t{font-size:12px;color:var(--text-muted);margin-top:3px;position:relative;}
  .card .actions{position:absolute;top:14px;right:14px;display:flex;gap:4px;opacity:0;z-index:2;}
  .card:hover .actions{opacity:1;}
  .progress-bar{height:7px;background:rgba(255,255,255,0.08);border-radius:4px;margin-top:11px;overflow:hidden;}
  .progress-bar div{height:100%;background:var(--accent,var(--violet));border-radius:4px;}
  .card .meta{font-size:11px;color:var(--text-muted);margin-top:6px;position:relative;}

  /* filter bar */
  .filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filterbar select,.filterbar input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-family:'Inter',sans-serif;font-size:12.5px;}

  /* tables */
  table.datatable{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.datatable th{text-align:left;color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--border);}
  table.datatable td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  table.datatable tr:last-child td{border-bottom:none;}
  table.datatable input[type=number]{width:90px;background:var(--surface-hi);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 7px;font-family:'JetBrains Mono',monospace;font-size:12px;}

  .disclaimer{font-size:11.5px;color:var(--amber);background:rgba(255,184,77,0.1);border:1px solid rgba(255,184,77,0.3);border-radius:10px;padding:10px 14px;margin-bottom:16px;}
  .infobox{font-size:12px;color:var(--text-muted);background:var(--surface);border:1px dashed var(--border-hi);border-radius:10px;padding:14px;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(8,5,18,0.7);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--bg1);border:1px solid var(--border-hi);width:460px;max-width:100%;padding:24px;border-radius:16px;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,0.5);}
  .modal.wide{width:760px;}
  .modal h3{font-size:17px;margin-bottom:16px;color:#fff;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:5px;font-weight:500;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-family:'Inter',sans-serif;font-size:13px;background:rgba(255,255,255,0.04);color:var(--text);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--violet);}
  .field select option{background:var(--bg1);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .toggle-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .toggle-row button{flex:1;min-width:80px;padding:9px;border:1px solid var(--border);background:rgba(255,255,255,0.03);border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-muted);font-family:'Inter',sans-serif;}
  .toggle-row button.on{background:rgba(139,108,255,0.22);border-color:var(--violet);color:#fff;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);margin-bottom:10px;}

  .toast{position:fixed;bottom:20px;right:20px;background:var(--bg1);border:1px solid var(--border-hi);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:100;opacity:0;transform:translateY(6px);transition:all .25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,0.4);max-width:320px;}
  .toast.show{opacity:1;transform:translateY(0);}

  @media (max-width:900px){
    .hero{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:760px){
    .app{flex-direction:column;}
    .sidebar{
      position:fixed; top:0; left:0; height:100vh; width:250px; z-index:150;
      flex-direction:column; align-items:stretch; padding:22px 14px;
      overflow-y:auto; border-right:1px solid var(--border); border-bottom:none;
      background:var(--bg1); box-shadow:0 0 40px rgba(0,0,0,0.5);
      transform:translateX(-105%); transition:transform .28s ease;
    }
    .sidebar.open{transform:translateX(0);}
    .brand{display:flex;}
    .navgroup{margin-bottom:10px;margin-right:0;}
    .navgroup-label{display:block;}
    nav{flex-direction:column;gap:2px;}
    .navbtn span{display:inline;}
    .sidebar-foot{display:block;}
    .sidebar-close{display:flex;}
    main{padding:18px;padding-top:70px;}
    .hero{grid-template-columns:1fr;}
    .row .acc{display:none;}
  }
  .hamburger{display:none;position:fixed;top:14px;left:14px;z-index:120;width:40px;height:40px;border-radius:10px;background:var(--surface-hi);border:1px solid var(--border-hi);color:#fff;align-items:center;justify-content:center;cursor:pointer;}
  .hamburger svg{width:19px;height:19px;}
  .sidebar-close{display:none;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:none;border:1px solid var(--border);color:var(--text-muted);cursor:pointer;margin-left:auto;}
  .sidebar-close svg{width:15px;height:15px;}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(8,5,18,0.6);z-index:140;}
  .sidebar-overlay.show{display:block;}
  @media (max-width:760px){ .hamburger{display:flex;} }

  /* Tutorial (accordion) */
  .tuto-intro{color:var(--text-muted);font-size:13.5px;line-height:1.6;margin-bottom:22px;max-width:640px;}
  .tuto-section{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;max-width:720px;}
  .tuto-section summary{padding:15px 18px;cursor:pointer;font-weight:600;color:var(--text);list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;}
  .tuto-section summary::-webkit-details-marker{display:none;}
  .tuto-section summary .plus{color:var(--violet);font-size:19px;font-weight:400;flex-shrink:0;transition:transform .2s;}
  .tuto-section[open] summary .plus{transform:rotate(45deg);}
  .tuto-section summary:hover{background:var(--surface-hi);}
  .tuto-body{padding:2px 18px 18px 18px;color:var(--text-muted);font-size:13px;line-height:1.65;}
  .tuto-body p{margin:0 0 10px 0;}
  .tuto-body ul{margin:6px 0 12px 0;padding-left:18px;}
  .tuto-body li{margin-bottom:6px;}
  .tuto-body b{color:var(--text);}
  .tuto-step{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start;}
  .tuto-step .n{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .tuto-step-title{color:var(--text);font-weight:600;font-size:13.5px;margin-bottom:3px;}
  .tuto-step-text{color:var(--text-muted);}

  @media print{
    body{background:#fff !important;color:#111 !important;}
    .sidebar,.hamburger,.sidebar-overlay,.toast,#overlay,.no-print{display:none !important;}
    main{padding:0 !important;max-width:100% !important;}
    .panel,.card,.row,.chip,.hero-cell{background:#fff !important;border-color:#ccc !important;box-shadow:none !important;color:#111 !important;}
    .hero-cell.total .value{-webkit-text-fill-color:#111 !important;background:none !important;color:#111 !important;}
    .num,h1,h2,h3,.card .v,.card .t,.card .k,.chip .val,.chip .lbl,table.datatable td,table.datatable th{color:#111 !important;}
    table.datatable th{color:#555 !important;border-color:#ccc !important;}
    table.datatable td{border-color:#eee !important;}
    .pos{color:#0a7a4a !important;} .neg{color:#b23b3b !important;}
    .badge{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }

  /* Auth gate */
  #authGate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
      radial-gradient(1100px 700px at 100% -10%, rgba(139,108,255,0.25), transparent 60%),
      radial-gradient(900px 600px at -10% 100%, rgba(0,230,160,0.12), transparent 55%),
      var(--bg0);z-index:200;padding:20px;}
  .authbox{width:380px;max-width:100%;background:var(--bg1);border:1px solid var(--border-hi);border-radius:18px;padding:32px;box-shadow:0 30px 80px rgba(0,0,0,0.5);}
  .authbox .brand-mark{margin:0 auto 16px auto;}
  .authbox h1{text-align:center;font-size:22px;color:#fff;}
  .authbox p.sub{text-align:center;color:var(--text-muted);font-size:13px;margin:6px 0 22px 0;}
  .authtabs{display:flex;gap:8px;margin-bottom:18px;}
  .authtabs button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--text-muted);font-weight:600;font-size:13px;cursor:pointer;}
  .authtabs button.on{background:rgba(139,108,255,0.22);border-color:var(--violet);color:#fff;}
  .autherr{background:rgba(255,92,122,0.12);border:1px solid rgba(255,92,122,0.35);color:var(--coral);font-size:12.5px;padding:10px 12px;border-radius:9px;margin-bottom:14px;display:none;}
  .authmsg{background:rgba(0,230,160,0.1);border:1px solid rgba(0,230,160,0.3);color:var(--mint);font-size:12.5px;padding:10px 12px;border-radius:9px;margin-bottom:14px;display:none;}
  #appRoot{display:none;}

function rangeForPeriod(period, customStart, customEnd){
  const now = new Date();
  let start, end;
  if(period==='mes-atual'){ start=new Date(now.getFullYear(),now.getMonth(),1); end=new Date(now.getFullYear(),now.getMonth()+1,0); }
  else if(period==='mes-anterior'){ start=new Date(now.getFullYear(),now.getMonth()-1,1); end=new Date(now.getFullYear(),now.getMonth(),0); }
  else if(period==='3m'){ start=new Date(now.getFullYear(),now.getMonth()-2,1); end=new Date(now.getFullYear(),now.getMonth()+1,0); }
  else if(period==='6m'){ start=new Date(now.getFullYear(),now.getMonth()-5,1); end=new Date(now.getFullYear(),now.getMonth()+1,0); }
  else if(period==='12m'){ start=new Date(now.getFullYear(),now.getMonth()-11,1); end=new Date(now.getFullYear(),now.getMonth()+1,0); }
  else if(period==='custom'){ start=customStart?new Date(customStart+'T00:00:00'):new Date(now.getFullYear(),now.getMonth(),1); end=customEnd?new Date(customEnd+'T00:00:00'):now; }
  else { start=new Date(now.getFullYear(),now.getMonth(),1); end=new Date(now.getFullYear(),now.getMonth()+1,0); }
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}

/* ---- IndexedDB (persiste no dispositivo, funciona sem internet) ---- */
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('granapp-db', 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('kv');
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('kv','readonly');
    const r = tx.objectStore('kv').get(key);
    r.onsuccess = ()=> resolve(r.result);
    r.onerror = ()=> reject(r.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}

}

/* =========================================================

========================================================= */
function applyRules(description){
  const desc = (description||'').toLowerCase();
  const active = data.rules.filter(r=>r.active).sort((a,b)=>(a.priority??99)-(b.priority??99));
  for(const r of active){
    const term = (r.matchText||'').toLowerCase();
    if(!term) continue;
    let hit=false;
    if(r.matchType==='contains') hit = desc.includes(term);
    else if(r.matchType==='equals') hit = desc===term;
    else if(r.matchType==='startsWith') hit = desc.startsWith(term);
    if(hit) return r;
  }
  return null;
}
/* Aplica as regras a lançamentos já existentes que ainda não foram classificados manualmente
   (inclui os que vieram de importação de extrato com categoria "A classificar").
   Nunca sobrescreve uma categoria que a pessoa já escolheu de propósito. */
function applyRulesToExisting(){
  let count = 0;
  data.transactions.forEach(t=>{
    if(t.type!=='despesa') return;
    if(t.category && t.category!=='A classificar') return;
    const rule = applyRules(t.description);
    if(rule){
      t.category = rule.category;
      t.fixedVariable = rule.fixedVariable;
      t.essential = rule.essential;
      t.purpose = rule.purpose;
      count++;
    }
  });
  return count;
}

function receitasInRange(range){

}
function despesasInRange(range, filterFn){
  return data.transactions.filter(t=>t.type==='despesa' && inRange(t.date,range) && (!filterFn||filterFn(t))).reduce((s,t)=>s+t.amount,0);
}
function investidoInRange(range){
  return data.transactions.filter(t=>t.type==='investimento' && inRange(t.date,range)).reduce((s,t)=>s+t.amount,0);
}

function essentialAvgMonthly(nMonths){
  const months = lastNMonthKeys(nMonths).map(m=>m.key);
  const byMonth = {};
  data.transactions.filter(t=>t.type==='despesa' && t.essential==='essencial' && months.includes(monthKey(t.date))).forEach(t=>{
    byMonth[monthKey(t.date)] = (byMonth[monthKey(t.date)]||0) + t.amount;
  });
  const withData = Object.values(byMonth);
  if(withData.length===0) return {avg:0, monthsWithData:0};
  return {avg: withData.reduce((a,b)=>a+b,0)/withData.length, monthsWithData: withData.length};
}
function reserveCurrent(){
  const accReserve = data.accounts.filter(a=>a.isReserve).reduce((s,a)=>s+a.balance,0);
  const invReserve = data.investments.filter(i=>i.objective==='Reserva de emergência').reduce((s,i)=>s+i.currentValue,0);
  return accReserve + invReserve;
}
function monthsWithAnyData(){
  const set = new Set();
  data.transactions.forEach(t=>set.add(monthKey(t.date)));
  data.shifts.forEach(s=>set.add(monthKey(s.date)));
  return set.size;
}

function splitRow(title, a, b, labelA, labelB, colorA, colorB){
  const total = Math.max(1, a+b);
  const pa = (a/total)*100, pb=(b/total)*100;
  return `
    <div class="split-row">
      <div class="split-row-title">${title}</div>
      <div class="split"><div style="width:${pa}%;background:${colorA}"></div><div style="width:${pb}%;background:${colorB}"></div></div>
      <div class="split-legend">
        <span><i style="background:${colorA}"></i>${labelA} <b>${fmtMoney(a)}</b> (${pa.toFixed(0)}%)</span>
        <span><i style="background:${colorB}"></i>${labelB} <b>${fmtMoney(b)}</b> (${pb.toFixed(0)}%)</span>
      </div>
    </div>`;
}
function renderAnaliseFinanceira(){
  const months = lastNMonthKeys(6);
  const incomes = months.map(m=>{
    const r = rangeForPeriod('custom', m.key+'-01', new Date(m.year,m.month+1,0).toISOString().slice(0,10));
    return receitasInRange(r);
  }).filter(v=>v>0);
  if(incomes.length===0) return '<div class="empty">Sem receitas suficientes ainda.</div>';
  const rendaMedia = incomes.reduce((a,b)=>a+b,0)/incomes.length;
  const rendaMin = Math.min(...incomes);
  const rendaMax = Math.max(...incomes);
  const essAvg = essentialAvgMonthly(6);
  const custoVida = essAvg.avg;
  const cobertura = custoVida>0 ? (rendaMedia/custoVida)*100 : 0;
  return `
    <div class="chipgrid">
      <div class="chip"><div class="lbl">Renda média mensal</div><div class="val">${fmtMoney(rendaMedia)}</div></div>
      <div class="chip"><div class="lbl">Menor renda</div><div class="val">${fmtMoney(rendaMin)}</div></div>
      <div class="chip"><div class="lbl">Maior renda</div><div class="val">${fmtMoney(rendaMax)}</div></div>
      <div class="chip"><div class="lbl">Gasto essencial médio</div><div class="val">${fmtMoney(custoVida)}</div></div>
      <div class="chip"><div class="lbl">Cobertura da renda sobre custo de vida</div><div class="val" style="color:${cobertura>=100?'var(--mint)':'var(--coral)'}">${cobertura.toFixed(0)}%</div></div>
    </div>`;
}

function onReceitaSourceChange(){
  const purpSel = document.getElementById('f_rxpurpose');
  if(purpSel) purpSel.value = purposeDefaultForSource(document.getElementById('f_source').value);
}
function purposeDefaultForSource(source){
  const map = {'Pensão':'pessoal','Plantão':'profissional','RPA':'profissional','CLT':'profissional','PJ':'profissional','Consultório':'profissional','Outros':'pessoal'};
  return map[source] || 'pessoal';
}
function receitaPurpose(t){ return t.purpose || purposeDefaultForSource(t.source); }
function onDescInput(){
  if(document.getElementById('f_cat')){
    const desc = document.getElementById('f_desc').value;
    const rule = applyRules(desc);
    if(rule && rule.category){
      const catSel = document.getElementById('f_cat'); if(catSel) catSel.value = rule.category;
      const fixedSel = document.getElementById('f_fixed'); if(fixedSel && rule.fixedVariable) fixedSel.value = rule.fixedVariable;
      const essSel = document.getElementById('f_essential'); if(essSel && rule.essential) essSel.value = rule.essential;
      const purpSel = document.getElementById('f_purpose'); if(purpSel && rule.purpose) purpSel.value = rule.purpose;
    }
  }
}
function saveTx(id){
  const description = document.getElementById('f_desc').value.trim();
  const amount = parseFloat(document.getElementById('f_amount').value);
  const date = document.getElementById('f_date').value;
  if(!description || isNaN(amount) || amount<=0 || !date){ toast('Preencha descrição, valor e data.'); return; }
  let extra = { type: txTypeState };
  if(txTypeState==='despesa'){
    extra.category = document.getElementById('f_cat').value;
    extra.fixedVariable = document.getElementById('f_fixed').value;
    extra.essential = document.getElementById('f_essential').value;
    extra.purpose = document.getElementById('f_purpose').value;
    extra.accountId = document.getElementById('f_acc').value;
    extra.notes = document.getElementById('f_notes').value;
  } else if(txTypeState==='receita'){
    extra.source = document.getElementById('f_source').value;
    extra.category = document.getElementById('f_source').value;
    extra.purpose = document.getElementById('f_rxpurpose').value;
    extra.accountId = document.getElementById('f_acc').value;
    extra.status = document.getElementById('f_status').value;
    extra.notes = document.getElementById('f_notes').value;
  } else if(txTypeState==='investimento'){
    extra.linkedInvestmentId = document.getElementById('f_invId').value || null;
    extra.accountId = document.getElementById('f_acc').value;
    extra.notes = document.getElementById('f_notes').value;
  } else {
    extra.accountId = document.getElementById('f_acc').value;
    extra.toAccountId = document.getElementById('f_toAcc').value;
  }
  if(id){
    const t = data.transactions.find(x=>x.id===id);
    Object.assign(t, {description, amount, date}, extra);
  }else{
    data.transactions.push(Object.assign({id: uid(), description, amount, date}, extra));
  }
  closeModal(); renderAll(); scheduleSave(); toast('Lançamento salvo.');
}

/* =========================================================
   RENDER: DRE (Demonstração de Resultado)
========================================================= */
let dreState = { period:'mes-atual', customStart:null, customEnd:null, scope:'consolidado' };
function scopeLabel(s){ return s==='pessoal'?'Pessoal': s==='profissional'?'Profissional':'Consolidado (Pessoal + Profissional)'; }
function computeDRE(range, scope){
  const matches = (p) => scope==='consolidado' ? true : p===scope;

  const receitaTx = data.transactions.filter(t=>t.type==='receita' && inRange(t.date,range) && matches(receitaPurpose(t)));
  const receitaShifts = matches('profissional') ? data.shifts.filter(s=>s.status==='Recebido' && inRange(s.actualDate||s.date,range)) : [];

  const receitaBySource = {};
  receitaTx.forEach(t=>{ const k=t.source||t.category||'Outros'; receitaBySource[k]=(receitaBySource[k]||0)+t.amount; });
  if(receitaShifts.length){
    const totalShifts = receitaShifts.reduce((s,sh)=>s+(sh.netAmount||sh.grossAmount||0),0);
    receitaBySource['Plantões'] = (receitaBySource['Plantões']||0) + totalShifts;
  }
  const totalReceita = Object.values(receitaBySource).reduce((a,b)=>a+b,0);

  const despesaTx = data.transactions.filter(t=>t.type==='despesa' && inRange(t.date,range) && matches(t.purpose||'pessoal'));
  const despesaByCat = {};
  despesaTx.forEach(t=>{ despesaByCat[t.category]=(despesaByCat[t.category]||0)+t.amount; });
  const totalDespesa = Object.values(despesaByCat).reduce((a,b)=>a+b,0);

  const fixo = despesaTx.filter(t=>t.fixedVariable==='fixo').reduce((s,t)=>s+t.amount,0);
  const variavel = despesaTx.filter(t=>t.fixedVariable==='variavel').reduce((s,t)=>s+t.amount,0);
  const essencial = despesaTx.filter(t=>t.essential==='essencial').reduce((s,t)=>s+t.amount,0);
  const naoEssencial = despesaTx.filter(t=>t.essential==='nao-essencial').reduce((s,t)=>s+t.amount,0);

  const investido = data.transactions.filter(t=>t.type==='investimento' && inRange(t.date,range) && (scope==='consolidado' || scope==='pessoal')).reduce((s,t)=>s+t.amount,0);

  const resultado = totalReceita - totalDespesa;
  const margem = totalReceita>0 ? (resultado/totalReceita)*100 : 0;

  return { receitaBySource, totalReceita, despesaByCat, totalDespesa, fixo, variavel, essencial, naoEssencial, investido, resultado, margem };
}
function setDreScope(s){ dreState.scope = s; renderDRE(); }

  const el = document.getElementById('page-dre');

        <button class="btn ghost no-print" onclick="window.print()">🖨️ Exportar / Imprimir</button>

    <div class="toggle-row no-print" style="max-width:440px;">
      <button class="drescope ${dreState.scope==='pessoal'?'on':''}" onclick="setDreScope('pessoal')">Pessoal</button>
      <button class="drescope ${dreState.scope==='profissional'?'on':''}" onclick="setDreScope('profissional')">Profissional</button>
      <button class="drescope ${dreState.scope==='consolidado'?'on':''}" onclick="setDreScope('consolidado')">Consolidado</button>
    </div>

    <div class="panel dre-report" style="margin-top:16px;max-width:640px;">
      <div style="text-align:center;margin-bottom:22px;">
        <h2 style="font-size:18px;">DRE — ${scopeLabel(dreState.scope)}</h2>
        <p style="color:var(--text-muted);font-size:12.5px;margin-top:4px;">Período: ${fmtDate(range.start)} a ${fmtDate(range.end)}</p>

  const payload = {
    name, amountInvested, currentValue,
    type: document.getElementById('f_itype').value,

function renderPatrimonio(){
  const el = document.getElementById('page-patrimonio');
  const dinheiro = data.accounts.filter(a=>a.type!=='Cartão de crédito').reduce((s,a)=>s+a.balance,0);
  const dividas = data.accounts.filter(a=>a.type==='Cartão de crédito').reduce((s,a)=>s+Math.abs(a.balance),0);
  const investido = investmentsTotal();
  const total = dinheiro + investido - dividas;
  const snaps = [...data.netWorthSnapshots].sort((a,b)=>a.date.localeCompare(b.date));
  const maxSnap = Math.max(1, total, ...snaps.map(s=>s.value));

  el.innerHTML = `
    <div class="page-head">
      <div><h1>Patrimônio</h1><p>Ativos menos passivos</p></div>
      <button class="btn accent" onclick="registerSnapshot()">Registrar snapshot de hoje</button>
    </div>
    <div class="hero">
      <div class="hero-cell total"><div class="label">Patrimônio líquido</div><div class="value num">${fmtMoney(total)}</div></div>
      <div class="hero-cell"><div class="label">Dinheiro em contas</div><div class="value num pos">${fmtMoney(dinheiro)}</div></div>
      <div class="hero-cell"><div class="label">Investido</div><div class="value num" style="color:var(--violet)">${fmtMoney(investido)}</div></div>
      <div class="hero-cell"><div class="label">Dívidas (cartão)</div><div class="value num neg">${fmtMoney(dividas)}</div></div>
    </div>
    <div class="infobox" style="margin-bottom:20px;">Transferências entre suas próprias contas não alteram o patrimônio total — apenas movem valor de um lugar para outro.</div>
    <section class="block">
      <div class="block-head"><h3>Evolução do patrimônio</h3></div>
      <div class="panel">
        ${snaps.length ? `
          <div class="chart">
            ${snaps.map(s=>`
              <div class="chart-col">
                <div class="chart-bars"><div class="bar in" style="height:${Math.max(3,(s.value/maxSnap)*118)}px;background:linear-gradient(180deg,#B7A2FF,var(--violet))" title="${fmtMoney(s.value)}"></div></div>
                <div class="lbl">${fmtDate(s.date)}</div>
              </div>`).join('')}
          </div>
        ` : `<div class="empty">Nenhum snapshot registrado ainda. Clique em "Registrar snapshot de hoje" periodicamente (ex: a cada 15 dias) para acompanhar sua evolução ao longo do tempo.</div>`}
      </div>
    </section>
  `;
}
function registerSnapshot(){
  const dinheiro = data.accounts.filter(a=>a.type!=='Cartão de crédito').reduce((s,a)=>s+a.balance,0);
  const dividas = data.accounts.filter(a=>a.type==='Cartão de crédito').reduce((s,a)=>s+Math.abs(a.balance),0);
  const total = dinheiro + investmentsTotal() - dividas;
  const today = todayStr();
  const existing = data.netWorthSnapshots.find(s=>s.date===today);
  if(existing) existing.value = total; else data.netWorthSnapshots.push({id:uid(), date: today, value: total});
  renderAll(); scheduleSave(); toast('Snapshot registrado.');
}

function saveGoal(id){

  data.transactions.forEach(t=>{
    if(t.type==='despesa' && (!t.category || t.category==='A classificar')){

      if(rule){
        t.category = rule.category;

        t.purpose = rule.purpose;
        count++;

    }
  });
  renderAll(); scheduleSave();
  toast(count>0 ? `${count} lançamento(s) reclassificado(s) pelas regras.` : 'Nenhum lançamento pendente ("a classificar") encontrado.');

async function ensureSheetJS(){
  if(window.XLSX) return;

    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);

}
async function ensurePDFJS(){
  if(window.pdfjsLib) return;
  await new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js';
    s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
}
async function extractPDFLines(file){
  await ensurePDFJS();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const lines = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const byY = {};
    content.items.forEach(item=>{
      const y = Math.round(item.transform[5]/2)*2; // agrupa itens na mesma linha (com tolerância)
      if(!byY[y]) byY[y]=[];
      byY[y].push(item);
    });
    const ys = Object.keys(byY).map(Number).sort((a,b)=>b-a); // topo -> base
    ys.forEach(y=>{
      const sorted = byY[y].sort((a,b)=>a.transform[4]-b.transform[4]); // esquerda -> direita
      lines.push(sorted.map(it=>it.str).join(' ').replace(/\s{2,}/g,' ').trim());
    });
  }
  return lines;
}
function extractPDFRowsFromLines(lines){
  const dateRe = /\d{2}\/\d{2}(?:\/\d{2,4})?/;
  const amountRe = /(-?\s?R?\$?\s?-?\d{1,3}(?:\.\d{3})*,\d{2}|-?\s?R?\$?\s?-?\d+,\d{2})\s*([DC])?\s*$/;
  const rows = [['Data','Descrição','Valor']];
  let matched=0, total=0;
  lines.forEach(line=>{
    if(!line) return;
    total++;
    const dm = line.match(dateRe);
    const am = line.match(amountRe);
    if(!dm || !am) return;
    const date = dm[0];
    let val = parseAmount(am[1].replace(/R\$/,'').trim());
    if(isNaN(val)) return;
    if(am[2]==='D') val = -Math.abs(val);
    if(am[2]==='C') val = Math.abs(val);
    let desc = line.slice(dm.index+dm[0].length, am.index).trim().replace(/^[-–:\s]+|[-–:\s]+$/g,'');
    if(!desc) desc = 'Lançamento';
    rows.push([date, desc, String(val)]);
    matched++;
  });
  return { rows, matched, total };
}
function parseOFXText(text){
  const rows = [['Data','Descrição','Valor']];
  const blocks = text.split(/<STMTTRN>/i).slice(1);
  blocks.forEach(block=>{
    const end = block.search(/<\/STMTTRN>/i);
    const chunk = end>=0 ? block.slice(0,end) : block;
    const dateM = chunk.match(/<DTPOSTED>\s*(\d{8})/i);
    const amtM = chunk.match(/<TRNAMT>\s*(-?\d+(?:\.\d+)?)/i);
    const memoM = chunk.match(/<MEMO>\s*([^\r\n<]+)/i) || chunk.match(/<NAME>\s*([^\r\n<]+)/i);
    if(!dateM || !amtM) return;
    const y = dateM[1].slice(0,4), mo = dateM[1].slice(4,6), d = dateM[1].slice(6,8);
    const desc = memoM ? memoM[1].trim() : 'Lançamento';
    rows.push([`${y}-${mo}-${d}`, desc, amtM[1]]);
  });
  return rows;
}
function parseCSVText(text){
  const rows = [];
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  const delim = lines[0] && lines[0].includes(';') && !lines[0].includes(',') ? ';' : ',';
  for(const line of lines){
    const cells = []; let cur=''; let inQuotes=false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch==='"'){ inQuotes = !inQuotes; }
      else if(ch===delim && !inQuotes){ cells.push(cur); cur=''; }
      else{ cur+=ch; }
    }
    cells.push(cur);
    rows.push(cells.map(c=>c.trim().replace(/^"|"$/g,'')));
  }
  return rows;
}
function parseBRDate(s){
  if(!s) return null;
  s = s.trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ let d=m[1], mo=m[2], y=m[3]; if(y.length===2) y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  return null;
}
function parseAmount(s){
  if(typeof s === 'number') return s;
  if(!s) return NaN;
  let v = String(s).trim().replace(/R\$\s?/,'');
  if(v.includes(',') && v.lastIndexOf(',')>v.lastIndexOf('.')){ v = v.replace(/\./g,'').replace(',','.'); }
  else { v = v.replace(/,/g,''); }
  return parseFloat(v);
}
async function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  importState.accountId = document.getElementById('imp_acc').value;
  const statusEl = document.getElementById('imp_status');
  statusEl.textContent = 'Lendo arquivo...';
  const name = file.name.toLowerCase();
  try{
    let table = [];
    if(name.endsWith('.csv')){
      const text = await file.text();
      table = parseCSVText(text);
    } else if(name.endsWith('.ofx')){
      const text = await file.text();
      table = parseOFXText(text);
      if(table.length<2){ statusEl.textContent='Não encontrei lançamentos (<STMTTRN>) neste arquivo OFX. Confira se é mesmo um extrato OFX válido exportado pelo banco.'; return; }
    } else if(name.endsWith('.pdf')){
      statusEl.textContent = 'Lendo PDF (pode levar alguns segundos)...';
      const lines = await extractPDFLines(file);
      const res = extractPDFRowsFromLines(lines);
      if(res.matched===0){
        statusEl.textContent = 'Não consegui reconhecer lançamentos neste PDF automaticamente. O layout deste extrato pode fugir do padrão esperado (data + descrição + valor por linha) — se possível, exporte como CSV ou Excel direto no site/app do banco.';
        return;
      }
      table = res.rows;
    } else {
      statusEl.textContent = 'Carregando leitor de planilha...';
      await ensureSheetJS();
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      table = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false});
    }
    table = table.filter(r=>r && r.some(c=>String(c||'').trim().length));
    if(table.length<2){ statusEl.textContent='Não foi possível ler linhas suficientes do arquivo.'; return; }
    importState.rawTable = table;
    const pdfNote = name.endsWith('.pdf') ? ' no PDF — confira com atenção, a leitura de PDF é experimental' : '';
    statusEl.textContent = `${table.length-1} linha(s) encontrada(s)${pdfNote}. Configure o mapeamento de colunas abaixo.`;
    renderColumnMapping(table);
  }catch(err){
    statusEl.textContent = 'Erro ao ler o arquivo: ' + err.message;
  }
}
function renderColumnMapping(table){
  const header = table[0];
  const colOptions = (sel)=> header.map((h,i)=>`<option value="${i}" ${i===sel?'selected':''}>${i}: ${escapeHtml(String(h))}</option>`).join('') + `<option value="-1" ${sel===-1?'selected':''}>— nenhuma —</option>`;
  const box = document.getElementById('imp_preview');
  box.innerHTML = `
    <div class="panel" style="margin-bottom:20px;">
      <div class="field-row">
        <div class="field"><label>Coluna da data</label><select id="map_date">${colOptions(0)}</select></div>
        <div class="field"><label>Coluna da descrição</label><select id="map_desc">${colOptions(1)}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Coluna do valor (positivo=receita, negativo=despesa)</label><select id="map_amount">${colOptions(2)}</select></div>
        <div class="field"><label>OU: coluna de débito separada (opcional)</label><select id="map_debit">${colOptions(-1)}</select></div>
      </div>
      <button class="btn accent sm" onclick="buildPreview()">Gerar prévia</button>
    </div>
    <div id="imp_table"></div>
  `;
}
function buildPreview(){
  const table = importState.rawTable;
  const dateCol = parseInt(document.getElementById('map_date').value);
  const descCol = parseInt(document.getElementById('map_desc').value);
  const amountCol = parseInt(document.getElementById('map_amount').value);
  const debitCol = parseInt(document.getElementById('map_debit').value);
  const rows = [];
  for(let i=1;i<table.length;i++){
    const r = table[i];
    const date = parseBRDate(r[dateCol]);
    const description = String(r[descCol]||'').trim();
    let amount = parseAmount(r[amountCol]);
    if(debitCol>=0){ const deb = parseAmount(r[debitCol]); if(!isNaN(deb) && deb!==0) amount = -Math.abs(deb); }
    if(!date || !description || isNaN(amount) || amount===0) continue;
    const type = amount>0 ? 'receita' : 'despesa';
    const rule = (type==='despesa') ? applyRules(description) : null;
    const dup = data.transactions.some(t=> t.date===date && Math.abs(t.amount-Math.abs(amount))<0.01 && t.description.toLowerCase()===description.toLowerCase());
    rows.push({
      id: uid(), date, description, amount: Math.abs(amount), type,
      category: rule ? rule.category : (type==='despesa' ? 'A classificar' : 'Outros'),
      fixedVariable: rule ? rule.fixedVariable : null, essential: rule ? rule.essential : null, purpose: rule ? rule.purpose : (type==='despesa'?'pessoal':null),
      duplicate: dup, include: !dup,
    });
  }
  importState.rows = rows;
  renderImportTable();
}
function renderImportTable(){
  const box = document.getElementById('imp_table');
  const rows = importState.rows;
  const selectedCount = rows.filter(r=>r.include).length;
  box.innerHTML = `
    <div class="page-head"><div><h3 style="font-size:14px;">${rows.length} lançamento(s) detectado(s) · ${selectedCount} selecionado(s)</h3></div>
      <button class="btn accent" onclick="confirmImport()" ${!importState.accountId?'disabled title="Selecione a conta de destino"':''}>Confirmar importação</button>
    </div>
    <div class="panel" style="overflow-x:auto;">
      <table class="datatable">
        <thead><tr><th></th><th>Data</th><th>Descrição</th><th>Tipo</th><th>Categoria</th><th>Valor</th><th></th></tr></thead>
        <tbody>
          ${rows.map((r,i)=>`
            <tr>
              <td><input type="checkbox" ${r.include?'checked':''} onchange="importState.rows[${i}].include=this.checked"></td>
              <td>${fmtDate(r.date)}</td>
              <td>${escapeHtml(r.description)}</td>
              <td>
                <select onchange="importState.rows[${i}].type=this.value">
                  <option value="despesa" ${r.type==='despesa'?'selected':''}>Despesa</option>
                  <option value="receita" ${r.type==='receita'?'selected':''}>Receita</option>
                  <option value="investimento" ${r.type==='investimento'?'selected':''}>Investimento</option>
                  <option value="transferencia" ${r.type==='transferencia'?'selected':''}>Transferência</option>
                </select>
              </td>
              <td><span class="badge" style="background:${colorForCategory(r.category)}26;color:${colorForCategory(r.category)}">${escapeHtml(r.category)}</span></td>
              <td class="num">${fmtMoney(r.amount)}</td>
              <td>${r.duplicate?'<span class="badge outline" style="color:var(--coral);border-color:var(--coral);">possível duplicata</span>':''}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function confirmImport(){
  const accId = importState.accountId;
  let count=0;
  importState.rows.filter(r=>r.include).forEach(r=>{
    data.transactions.push({
      id: uid(), type: r.type, description: r.description, amount: r.amount, date: r.date,
      category: r.category, fixedVariable: r.fixedVariable, essential: r.essential, purpose: r.purpose,
      accountId: accId, notes: 'Importado de extrato'
    });
    count++;
  });
  importState = { rows: [], accountId: null };
  renderAll(); scheduleSave();
  toast(`${count} lançamento(s) importado(s).`);
  showPage('lancamentos');
}
